<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1005" viewBox="0 0 680 670" role="img">
<title>Flujo ante una vulnerabilidad v1</title>
<desc>Una herramienta detecta un hallazgo, se envía a DefectDojo, se decide si supera el umbral y si la etapa es bloqueante, y después se hace el triaje para decidir si es falso positivo o se corrige.</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box>rect{fill:#F1EFE8;stroke:#888780}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>polygon{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="670" fill="#FFFFFF"/>

<g class="c-teal"><rect x="210" y="16" width="260" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="36" text-anchor="middle" dominant-baseline="central">Herramienta detecta hallazgo</text></g>
<line x1="340" y1="56" x2="340" y2="80" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="210" y="82" width="260" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="102" text-anchor="middle" dominant-baseline="central">Informe a DefectDojo</text>
<text class="ts" x="340" y="120" text-anchor="middle" dominant-baseline="central">job final, siempre, vía API</text></g>
<line x1="340" y1="134" x2="340" y2="150" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><polygon points="340,150 455,186 340,222 225,186" stroke-width="0.5"/>
<text class="th" x="340" y="186" text-anchor="middle" dominant-baseline="central">¿Crítica o alta?</text></g>

<line x1="455" y1="186" x2="490" y2="186" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="472" y="176" text-anchor="middle">no</text>
<g class="box"><rect x="492" y="166" width="170" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="577" y="180" text-anchor="middle" dominant-baseline="central">Sin bloqueo</text>
<text class="ts" x="577" y="196" text-anchor="middle" dominant-baseline="central">queda activo en Dojo</text></g>

<line x1="340" y1="222" x2="340" y2="254" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="240">sí</text>

<g class="c-gray"><polygon points="340,254 455,290 340,326 225,290" stroke-width="0.5"/>
<text class="th" x="340" y="290" text-anchor="middle" dominant-baseline="central">¿Etapa bloqueante?</text></g>

<line x1="225" y1="290" x2="202" y2="290" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="213" y="280" text-anchor="middle">no</text>
<g class="c-amber"><rect x="20" y="270" width="180" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="284" text-anchor="middle" dominant-baseline="central">Modo aviso (Gate A)</text>
<text class="ts" x="110" y="300" text-anchor="middle" dominant-baseline="central">sigue y avisa en la PR</text></g>

<line x1="340" y1="326" x2="340" y2="362" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="348">sí</text>
<g class="c-red"><rect x="240" y="364" width="200" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="384" text-anchor="middle" dominant-baseline="central">Bloquea (Gate B)</text>
<text class="ts" x="340" y="402" text-anchor="middle" dominant-baseline="central">sin deploy · avisa al autor</text></g>

<path d="M110 310 V 496 H 198" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M577 206 V 496 H 482" class="arr" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="416" x2="340" y2="468" class="arr" marker-end="url(#arrow)"/>

<g class="c-purple"><rect x="200" y="470" width="280" height="52" rx="8" stroke-width="0.5"/>
<text class="th" x="340" y="490" text-anchor="middle" dominant-baseline="central">Triaje en DefectDojo</text>
<text class="ts" x="340" y="508" text-anchor="middle" dominant-baseline="central">el equipo revisa y prioriza</text></g>
<line x1="340" y1="522" x2="340" y2="554" class="arr" marker-end="url(#arrow)"/>

<g class="c-gray"><polygon points="340,554 455,590 340,626 225,590" stroke-width="0.5"/>
<text class="th" x="340" y="590" text-anchor="middle" dominant-baseline="central">¿Falso positivo?</text></g>

<line x1="225" y1="590" x2="202" y2="590" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="213" y="580" text-anchor="middle">sí</text>
<g class="box"><rect x="20" y="570" width="180" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="110" y="584" text-anchor="middle" dominant-baseline="central">False positive</text>
<text class="ts" x="110" y="600" text-anchor="middle" dominant-baseline="central">se justifica y se ajusta</text></g>

<line x1="455" y1="590" x2="478" y2="590" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="467" y="580" text-anchor="middle">no</text>
<g class="c-green"><rect x="480" y="570" width="180" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="570" y="584" text-anchor="middle" dominant-baseline="central">Corregir y commit</text>
<text class="ts" x="570" y="600" text-anchor="middle" dominant-baseline="central">↻ vuelve al inicio</text></g>
</svg>
