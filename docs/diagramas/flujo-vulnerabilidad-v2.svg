<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="1740" viewBox="0 0 680 1160" role="img">
<title>Flujo ante una vulnerabilidad v2</title>
<desc>Qué ocurre desde que una herramienta detecta un hallazgo: umbral, etapa bloqueante, aviso al equipo, y dentro de DefectDojo: duplicados, ciclo de vida, severidad con su SLA y triaje (falso positivo, fuera de alcance, riesgo aceptado o real).</desc>
<style>
text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.ts{font-size:12px;fill:#5F5E5A}
.th{font-size:14px;font-weight:500;fill:#2C2C2A}
.box>rect{fill:#F1EFE8;stroke:#888780}
rect.box{stroke:#888780}
.cont{fill:none;stroke:#888780}
.arr{stroke:#5F5E5A;stroke-width:1.5;fill:none}
.c-gray>polygon{fill:#F1EFE8;stroke:#5F5E5A}.c-gray .th{fill:#444441}
.c-teal>rect{fill:#E1F5EE;stroke:#0F6E56}.c-teal .th{fill:#085041}.c-teal .ts{fill:#0F6E56}
.c-amber>rect{fill:#FAEEDA;stroke:#854F0B}.c-amber .th{fill:#633806}.c-amber .ts{fill:#854F0B}
.c-red>rect{fill:#FCEBEB;stroke:#A32D2D}.c-red .th{fill:#791F1F}.c-red .ts{fill:#A32D2D}
.c-purple>rect{fill:#EEEDFE;stroke:#534AB7}.c-purple .th{fill:#3C3489}.c-purple .ts{fill:#534AB7}
.c-green>rect{fill:#EAF3DE;stroke:#3B6D11}.c-green .th{fill:#27500A}.c-green .ts{fill:#3B6D11}
</style>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="1160" fill="#FFFFFF"/>
<rect class="cont" x="8" y="8" width="664" height="354" rx="12" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="22" y="28" text-anchor="start" dominant-baseline="central">En el pipeline</text>
<rect class="cont" x="8" y="380" width="664" height="766" rx="12" stroke-width="0.5" stroke-dasharray="5 4"/>
<text class="th" x="22" y="400" text-anchor="start" dominant-baseline="central">En DefectDojo</text>
<g class="c-teal"><rect x="210" y="42" width="260" height="36" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="60.0" text-anchor="middle" dominant-baseline="central">Herramienta detecta hallazgo</text>
</g>
<line x1="340" y1="78" x2="340" y2="100" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><polygon points="340,100 455,134 340,168 225,134" stroke-width="0.5"/>
<text class="th" x="340" y="134" text-anchor="middle" dominant-baseline="central">¿Supera el umbral?</text>
</g>
<line x1="455" y1="134" x2="486" y2="134" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="122" text-anchor="middle" dominant-baseline="central">no</text>
<g class="box"><rect x="488" y="114" width="174" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="575.0" y="125.0" text-anchor="middle" dominant-baseline="central">Sin bloqueo</text>
<text class="ts" x="575.0" y="143.0" text-anchor="middle" dominant-baseline="central">se importa igual</text>
</g>
<line x1="340" y1="168" x2="340" y2="196" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="184" text-anchor="start" dominant-baseline="central">sí</text>
<g class="c-gray"><polygon points="340,196 455,230 340,264 225,230" stroke-width="0.5"/>
<text class="th" x="340" y="230" text-anchor="middle" dominant-baseline="central">¿Etapa bloqueante?</text>
</g>
<line x1="225" y1="230" x2="206" y2="230" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="215" y="218" text-anchor="middle" dominant-baseline="central">no</text>
<g class="c-amber"><rect x="14" y="210" width="190" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="109.0" y="221.0" text-anchor="middle" dominant-baseline="central">Modo aviso (Gate A)</text>
<text class="ts" x="109.0" y="239.0" text-anchor="middle" dominant-baseline="central">sigue y avisa en la PR</text>
</g>
<line x1="340" y1="264" x2="340" y2="290" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="280" text-anchor="start" dominant-baseline="central">sí</text>
<g class="c-red"><rect x="240" y="290" width="200" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="306.0" text-anchor="middle" dominant-baseline="central">Bloquea (Gate B)</text>
<text class="ts" x="340.0" y="324.0" text-anchor="middle" dominant-baseline="central">sin deploy · avisa al autor</text>
</g>
<g class="c-purple"><rect x="210" y="414" width="260" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="430.0" text-anchor="middle" dominant-baseline="central">El informe llega a DefectDojo</text>
<text class="ts" x="340.0" y="448.0" text-anchor="middle" dominant-baseline="central">job final, siempre, vía API</text>
</g>
<path d="M170 250 V439 H208" class="arr" fill="none" marker-end="url(#arrow)"/>
<path d="M577 154 V439 H472" class="arr" fill="none" marker-end="url(#arrow)"/>
<line x1="340" y1="340" x2="340" y2="414" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="464" x2="340" y2="490" class="arr" marker-end="url(#arrow)"/>
<g class="c-gray"><polygon points="340,490 455,524 340,558 225,524" stroke-width="0.5"/>
<text class="th" x="340" y="524" text-anchor="middle" dominant-baseline="central">¿Ya existe?</text>
</g>
<line x1="225" y1="524" x2="206" y2="524" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="215" y="512" text-anchor="middle" dominant-baseline="central">sí</text>
<g class="box"><rect x="14" y="504" width="190" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="109.0" y="515.0" text-anchor="middle" dominant-baseline="central">Se actualiza</text>
<text class="ts" x="109.0" y="533.0" text-anchor="middle" dominant-baseline="central">no se crea otro hallazgo</text>
</g>
<g class="box"><rect x="488" y="496" width="174" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="575.0" y="513.0" text-anchor="middle" dominant-baseline="central">Ciclo de vida</text>
<text class="ts" x="575.0" y="531.0" text-anchor="middle" dominant-baseline="central">no aparece: se cierra</text>
<text class="ts" x="575.0" y="549.0" text-anchor="middle" dominant-baseline="central">reaparece: se reabre</text>
</g>
<line x1="455" y1="524" x2="486" y2="531" class="arr" stroke-dasharray="4 3"/>
<line x1="340" y1="558" x2="340" y2="584" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="574" text-anchor="start" dominant-baseline="central">no</text>
<g class="c-gray"><polygon points="340,584 455,618 340,652 225,618" stroke-width="0.5"/>
<text class="th" x="340" y="618" text-anchor="middle" dominant-baseline="central">¿Lo repite otro test?</text>
</g>
<line x1="455" y1="618" x2="486" y2="618" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="470" y="606" text-anchor="middle" dominant-baseline="central">sí</text>
<g class="box"><rect x="488" y="598" width="174" height="40" rx="8" stroke-width="0.5"/>
<text class="th" x="575.0" y="609.0" text-anchor="middle" dominant-baseline="central">Se marca Duplicate</text>
<text class="ts" x="575.0" y="627.0" text-anchor="middle" dominant-baseline="central">se tria el original</text>
</g>
<line x1="340" y1="652" x2="340" y2="682" class="arr" marker-end="url(#arrow)"/>
<text class="ts" x="352" y="670" text-anchor="start" dominant-baseline="central">no</text>
<g class="c-teal"><rect x="240" y="682" width="200" height="44" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="695.0" text-anchor="middle" dominant-baseline="central">Hallazgo nuevo</text>
<text class="ts" x="340.0" y="713.0" text-anchor="middle" dominant-baseline="central">se crea como Active</text>
</g>
<g class="box"><rect x="210" y="760" width="260" height="34" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="777.0" text-anchor="middle" dominant-baseline="central">¿Qué severidad tiene?</text>
</g>
<line x1="340" y1="726" x2="340" y2="760" class="arr" marker-end="url(#arrow)"/>
<path d="M109 544 V777 H208" class="arr" fill="none" marker-end="url(#arrow)"/>
<line x1="97" y1="808" x2="583" y2="808" class="arr"/>
<line x1="340" y1="794" x2="340" y2="808" class="arr"/>
<line x1="97" y1="808" x2="97" y2="822" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="22" y="822" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="97.0" y="839.0" text-anchor="middle" dominant-baseline="central">Critical</text>
<text class="ts" x="97.0" y="857.0" text-anchor="middle" dominant-baseline="central">SLA 7 días</text>
<text class="ts" x="97.0" y="875.0" text-anchor="middle" dominant-baseline="central">máxima prioridad</text>
</g>
<line x1="97" y1="892" x2="97" y2="912" class="arr"/>
<line x1="259" y1="808" x2="259" y2="822" class="arr" marker-end="url(#arrow)"/>
<g class="c-red"><rect x="184" y="822" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="259.0" y="839.0" text-anchor="middle" dominant-baseline="central">High</text>
<text class="ts" x="259.0" y="857.0" text-anchor="middle" dominant-baseline="central">SLA 30 días</text>
<text class="ts" x="259.0" y="875.0" text-anchor="middle" dominant-baseline="central">verificar y corregir</text>
</g>
<line x1="259" y1="892" x2="259" y2="912" class="arr"/>
<line x1="421" y1="808" x2="421" y2="822" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="346" y="822" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="421.0" y="839.0" text-anchor="middle" dominant-baseline="central">Medium</text>
<text class="ts" x="421.0" y="857.0" text-anchor="middle" dominant-baseline="central">SLA 90 días</text>
<text class="ts" x="421.0" y="875.0" text-anchor="middle" dominant-baseline="central">se planifica</text>
</g>
<line x1="421" y1="892" x2="421" y2="912" class="arr"/>
<line x1="583" y1="808" x2="583" y2="822" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="508" y="822" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="583.0" y="839.0" text-anchor="middle" dominant-baseline="central">Low / Info</text>
<text class="ts" x="583.0" y="857.0" text-anchor="middle" dominant-baseline="central">Low: 120 días</text>
<text class="ts" x="583.0" y="875.0" text-anchor="middle" dominant-baseline="central">Info: sin plazo</text>
</g>
<line x1="583" y1="892" x2="583" y2="912" class="arr"/>
<line x1="97" y1="912" x2="583" y2="912" class="arr"/>
<line x1="340" y1="912" x2="340" y2="934" class="arr" marker-end="url(#arrow)"/>
<g class="c-purple"><rect x="200" y="934" width="280" height="50" rx="8" stroke-width="0.5"/>
<text class="th" x="340.0" y="950.0" text-anchor="middle" dominant-baseline="central">Triaje en DefectDojo</text>
<text class="ts" x="340.0" y="968.0" text-anchor="middle" dominant-baseline="central">el equipo revisa y prioriza</text>
</g>
<line x1="340" y1="984" x2="340" y2="998" class="arr"/>
<line x1="97" y1="998" x2="583" y2="998" class="arr"/>
<line x1="97" y1="998" x2="97" y2="1014" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="22" y="1014" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="97.0" y="1031.0" text-anchor="middle" dominant-baseline="central">Falso positivo</text>
<text class="ts" x="97.0" y="1049.0" text-anchor="middle" dominant-baseline="central">se justifica y se</text>
<text class="ts" x="97.0" y="1067.0" text-anchor="middle" dominant-baseline="central">ajusta la regla</text>
</g>
<line x1="259" y1="998" x2="259" y2="1014" class="arr" marker-end="url(#arrow)"/>
<g class="box"><rect x="184" y="1014" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="259.0" y="1031.0" text-anchor="middle" dominant-baseline="central">Fuera de alcance</text>
<text class="ts" x="259.0" y="1049.0" text-anchor="middle" dominant-baseline="central">queda cerrado</text>
<text class="ts" x="259.0" y="1067.0" text-anchor="middle" dominant-baseline="central">con su motivo</text>
</g>
<line x1="421" y1="998" x2="421" y2="1014" class="arr" marker-end="url(#arrow)"/>
<g class="c-amber"><rect x="346" y="1014" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="421.0" y="1031.0" text-anchor="middle" dominant-baseline="central">Riesgo aceptado</text>
<text class="ts" x="421.0" y="1049.0" text-anchor="middle" dominant-baseline="central">con justificación</text>
<text class="ts" x="421.0" y="1067.0" text-anchor="middle" dominant-baseline="central">(en la interfaz)</text>
</g>
<line x1="583" y1="998" x2="583" y2="1014" class="arr" marker-end="url(#arrow)"/>
<g class="c-green"><rect x="508" y="1014" width="150" height="70" rx="8" stroke-width="0.5"/>
<text class="th" x="583.0" y="1031.0" text-anchor="middle" dominant-baseline="central">Real</text>
<text class="ts" x="583.0" y="1049.0" text-anchor="middle" dominant-baseline="central">corregir y commit</text>
<text class="ts" x="583.0" y="1067.0" text-anchor="middle" dominant-baseline="central">↻ vuelve al inicio</text>
</g>
<rect class="box" x="22" y="1104" width="636" height="30" rx="6" stroke-width="0.5" stroke-dasharray="4 3" fill="none"/>
<text class="ts" x="340" y="1119" text-anchor="middle" dominant-baseline="central">Tras corregir, el siguiente informe ya no trae el hallazgo y DefectDojo lo cierra (Mitigated).</text>
</svg>
