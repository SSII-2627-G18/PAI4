# DefectDojo MÍNIMO Y EFÍMERO para el pipeline (adaptado del docker-compose.yml oficial, v3.5.202).
# Se levanta dentro del runner de GitHub, recibe los informes y desaparece al terminar el job.
# Las claves se generan en cada ejecución (ver .github/workflows/devsecops.yml), no hay secretos en el repo.
# Imágenes: registry.defectdojo.com (para usar Docker Hub, DD_IMAGE_REGISTRY=docker.io).

x-django-env: &django-env
  DD_DATABASE_URL: postgresql://defectdojo:defectdojo@postgres:5432/defectdojo
  DD_CELERY_BROKER_URL: redis://valkey:6379/0
  DD_CACHE_URL: redis://valkey:6379/1
  DD_SECRET_KEY: "${DD_SECRET_KEY:?falta DD_SECRET_KEY}"
  DD_CREDENTIAL_AES_256_KEY: "${DD_CREDENTIAL_AES_256_KEY:?falta DD_CREDENTIAL_AES_256_KEY}"
  DD_DATABASE_READINESS_TIMEOUT: "30"

x-django-image: &django-image
  image: "${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-django:${DD_VERSION:-3.5.202}"

services:
  nginx:
    image: "${DD_IMAGE_REGISTRY:-registry.defectdojo.com}/defectdojo/defectdojo-nginx:${DD_VERSION:-3.5.202}"
    depends_on:
      - uwsgi
    environment:
      DD_UWSGI_HOST: uwsgi
      DD_UWSGI_PORT: "3031"
    volumes:
      - defectdojo_media:/usr/share/nginx/html/media
    ports:
      # Solo accesible desde la propia máquina.
      - "127.0.0.1:${DD_PORT:-8080}:8080"

  uwsgi:
    <<: *django-image
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-uwsgi.sh"]
    environment:
      <<: *django-env
      DD_DEBUG: "False"
      DD_ALLOWED_HOSTS: "*"
    volumes:
      - defectdojo_media:/app/media

  celerybeat:
    <<: *django-image
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-celery-beat.sh"]
    environment:
      <<: *django-env

  celeryworker:
    <<: *django-image
    depends_on:
      initializer:
        condition: service_completed_successfully
      postgres:
        condition: service_started
      valkey:
        condition: service_started
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "-t", "30", "--", "/entrypoint-celery-worker.sh"]
    environment:
      <<: *django-env
    volumes:
      - defectdojo_media:/app/media

  initializer:
    <<: *django-image
    depends_on:
      - postgres
    entrypoint: ["/wait-for-it.sh", "postgres:5432", "--", "/entrypoint-initializer.sh"]
    environment:
      <<: *django-env
      DD_ADMIN_USER: admin
      DD_ADMIN_MAIL: admin@defectdojo.local
      DD_ADMIN_PASSWORD: "${DD_ADMIN_PASSWORD:?falta DD_ADMIN_PASSWORD}"
      DD_ADMIN_FIRST_NAME: Admin
      DD_ADMIN_LAST_NAME: User
      DD_INITIALIZE: "true"

  postgres:
    image: postgres:18.6-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: defectdojo
      POSTGRES_USER: defectdojo
      POSTGRES_PASSWORD: defectdojo
    volumes:
      - defectdojo_postgres:/var/lib/postgresql/data

  valkey:
    image: valkey/valkey:9.1.2-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    volumes:
      - defectdojo_redis:/data

volumes:
  defectdojo_postgres: {}
  defectdojo_media: {}
  defectdojo_redis: {}
