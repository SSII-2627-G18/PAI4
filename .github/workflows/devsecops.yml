name: DevSecOps pipeline

# Se ejecuta en cada push o pull request a main (y a mano desde la pestaña Actions).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Herramientas fijadas por digest (cadena de suministro reproducible).
  SEMGREP_IMAGE: semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d # 1.185.0
  TRIVY_IMAGE: aquasec/trivy@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb # 0.76.2
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af # stable
  # Gate B: riesgo ZAP mínimo que bloquea (3 = High, 2 = Medium). Con el escaneo baseline
  # Juice Shop no produce alertas High, por eso el umbral parte de Medium.
  ZAP_MIN_RISK: "2"
  # DefectDojo: producto y engagement donde se organizan los resultados.
  DD_PRODUCT_TYPE: Research and Development
  DD_PRODUCT: Juice Shop G18
  DD_ENGAGEMENT: Pipeline CI

jobs:
  # ── Etapa 1 · Build ───────────────────────────────────────────────────────
  build:
    name: Build · imagen Docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Construir imagen
        run: docker build -t juice-shop:ci app/juice-shop
      - name: Guardar imagen para las etapas siguientes
        run: docker save juice-shop:ci | gzip > image.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image
          path: image.tar.gz
          retention-days: 1
          compression-level: 0

  # ── Etapa 2 · Análisis (SAST + IaC) ───────────────────────────────────────
  sast:
    name: Análisis · Semgrep (SAST)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Semgrep
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/src" "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off \
            --config p/javascript --config p/typescript --config p/owasp-top-ten \
            --json --output /src/reports/semgrep.json /src/app/juice-shop
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-semgrep
          path: reports/semgrep.json

  iac:
    name: Análisis · Trivy config (IaC)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy config
        run: |
          mkdir -p reports
          docker run --rm -v "$PWD:/work" "$TRIVY_IMAGE" \
            config --format json --output /work/reports/trivy-config.json /work
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-trivy
          path: reports/trivy-config.json

  # ── Gate A · MODO AVISO ───────────────────────────────────────────────────
  # Los pasos fallan si hay hallazgos Critical/High, pero `continue-on-error` hace
  # que el pipeline siga. La aplicación es vulnerable a propósito: si este gate
  # bloqueara, el DAST nunca llegaría a ejecutarse.
  gate-a:
    name: Gate A · aviso (Critical/High)
    needs: [sast, iac]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: Gate A · Semgrep
        continue-on-error: true
        run: python3 scripts/gate.py semgrep reports/semgrep.json
      - name: Gate A · Trivy
        continue-on-error: true
        run: python3 scripts/gate.py trivy reports/trivy-config.json

  # ── Etapas 3 y 4 · Staging + DAST ─────────────────────────────────────────
  dast:
    name: Staging y DAST · ZAP
    needs: gate-a
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image
      - name: Staging · desplegar Juice Shop
        run: |
          gunzip -c image.tar.gz | docker load
          docker run -d --name juice-shop -p 3000:3000 juice-shop:ci
          for _ in $(seq 1 40); do
            curl -fsS http://localhost:3000/ >/dev/null 2>&1 && exit 0
            sleep 3
          done
          docker logs juice-shop
          echo "::error::Juice Shop no arrancó en staging"
          exit 1
      - name: DAST · ZAP baseline (solo contra nuestra propia app en staging)
        run: |
          mkdir -p reports && chmod 777 reports
          set +e
          docker run --rm --network host -v "$PWD/reports:/zap/wrk:rw" "$ZAP_IMAGE" \
            zap-baseline.py -t http://localhost:3000 -x zap.xml -J zap.json -I
          rc=$?
          set -e
          # 0 = sin alertas, 1/2 = alertas; cualquier otro código es un fallo de la herramienta
          if [ "$rc" -gt 2 ]; then echo "::error::ZAP terminó con código $rc"; exit "$rc"; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: report-zap
          path: |
            reports/zap.json
            reports/zap.xml

  # ── Gate B · BLOQUEANTE ───────────────────────────────────────────────────
  # Sin `continue-on-error`: si hay alertas sobre el umbral el job falla y `deploy` no se ejecuta.
  gate-b:
    name: Gate B · bloqueante (ZAP)
    needs: dast
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: report-zap
          path: reports
      - name: Gate B · ZAP
        run: python3 scripts/gate.py zap reports/zap.json --min-zap-risk "$ZAP_MIN_RISK"

  # ── Etapa 5 · Producción (simulada) ───────────────────────────────────────
  deploy:
    name: Producción (simulada)
    needs: gate-b
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # El entorno `production` debe tener revisores obligatorios en Settings > Environments.
    environment: production
    steps:
      - name: Despliegue simulado
        run: echo "Solo se llega aquí si el gate B ha pasado y alguien ha aprobado."

  # ── Gestión de vulnerabilidades · DefectDojo ──────────────────────────────
  # Se ejecuta siempre, incluso si un gate bloquea, para que los hallazgos queden registrados.
  # Por defecto levanta un DefectDojo EFÍMERO dentro del propio runner: sin infraestructura ni
  # secretos, y desaparece al acabar el job. Los resultados se conservan como artefacto.
  # Si existen los secretos DEFECTDOJO_URL y DEFECTDOJO_TOKEN, importa en esa instancia externa.
  defectdojo:
    name: DefectDojo · importar, triar y exportar
    needs: [sast, iac, dast]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      EXT_DD_URL: ${{ secrets.DEFECTDOJO_URL }}
      EXT_DD_TOKEN: ${{ secrets.DEFECTDOJO_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: report-*
          path: reports
          merge-multiple: true
      - name: DefectDojo efímero · levantar
        if: env.EXT_DD_URL == '' || env.EXT_DD_TOKEN == ''
        run: |
          bash scripts/defectdojo_arrancar.sh
          echo "DD_EPHEMERAL=true" >> "$GITHUB_ENV"
      - name: DefectDojo externo · usar instancia de los secretos
        if: env.EXT_DD_URL != '' && env.EXT_DD_TOKEN != ''
        run: |
          echo "DD_URL=$EXT_DD_URL" >> "$GITHUB_ENV"
          echo "DD_TOKEN=$EXT_DD_TOKEN" >> "$GITHUB_ENV"
      - name: Importar informes (reimport-scan por API)
        run: bash scripts/defectdojo_import.sh
      - name: Triaje y exportación (solo en la instancia efímera)
        if: env.DD_EPHEMERAL == 'true'
        run: python3 scripts/defectdojo_triaje.py --salida reports/defectdojo-hallazgos.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && env.DD_EPHEMERAL == 'true'
        with:
          name: defectdojo-hallazgos
          path: reports/defectdojo-hallazgos.json
      - name: Registros de DefectDojo (solo si algo falla)
        if: failure() && env.DD_EPHEMERAL == 'true'
        run: docker compose -f ci/defectdojo/docker-compose.yml --env-file ci/defectdojo/.env logs --tail 60
